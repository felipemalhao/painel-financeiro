<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>Painel Brochevique</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<style>
:root{
  --bg:#0d0f14; --bg2:#141821; --bg3:#1b2029; --line:#252b37;
  --tx:#e8ecf3; --tx2:#98a2b6; --tx3:#5f6a80;
  --red:#e5484d; --green:#3dd68c; --amber:#ffb224; --blue:#5b8def; --purple:#a97bff;
  --r:14px; --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--tx);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  padding-bottom:calc(68px + var(--safe));
  overscroll-behavior-y:contain;
}
button,input,select{font:inherit;color:inherit}
/* o padding padrao do <button> (1px 6px) engolia a largura das barras do grafico */
button{background:none;border:0;padding:0;cursor:pointer}
a{color:var(--blue)}
.hide{display:none !important}

/* ---------- login ---------- */
#login{min-height:100dvh;display:grid;place-items:center;padding:24px}
#login .box{width:100%;max-width:340px;text-align:center}
#login h1{font-size:26px;margin:0 0 4px;letter-spacing:-.5px}
#login p{color:var(--tx2);margin:0 0 24px;font-size:14px}
#login input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;margin-bottom:10px;font-size:16px}
#login button{width:100%;background:var(--red);border-radius:12px;padding:14px;font-weight:650;color:#fff}
#erro{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:30;background:rgba(13,15,20,.86);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.hd h1{font-size:17px;margin:0;font-weight:680;letter-spacing:-.3px;flex:1}
.hd .sub{font-size:11px;color:var(--tx3);font-weight:400;display:block;margin-top:1px}
.ico{width:34px;height:34px;border-radius:10px;background:var(--bg3);display:grid;place-items:center;font-size:15px}

.chips{display:flex;gap:7px;padding:0 16px 11px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:999px;background:var(--bg3);
  color:var(--tx2);font-size:13px;font-weight:550;border:1px solid transparent;white-space:nowrap}
.chip.on{background:var(--tx);color:#0d0f14;font-weight:650}
.chip.alt.on{background:var(--blue);color:#fff}

main{padding:16px 16px 24px;max-width:760px;margin:0 auto}
.sec{margin-bottom:22px}
.sec>h2{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--tx3);
  margin:0 0 9px;font-weight:650;display:flex;align-items:center;gap:8px}
.sec>h2 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12px;color:var(--tx2);font-weight:500}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card+.card{margin-top:10px}

/* ---------- hero ---------- */
.hero{padding:18px 16px 16px;background:linear-gradient(160deg,var(--bg3),var(--bg2))}
.hero .lbl{font-size:12px;color:var(--tx2);font-weight:550;display:flex;align-items:center;gap:6px}
.hero .big{font-size:38px;font-weight:730;letter-spacing:-1.6px;margin:3px 0 0;line-height:1.05}
.hero .meta{display:flex;gap:8px;align-items:baseline;margin-top:7px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:620;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--tx2)}
.pos{color:var(--green)} .neg{color:var(--red)}
.pill.pos{background:rgba(61,214,140,.13);color:var(--green)}
.pill.neg{background:rgba(229,72,77,.13);color:var(--red)}

/* ---------- cascata ---------- */
.wf .ln{display:flex;align-items:center;gap:11px;padding:12px 15px;border-top:1px solid var(--line);
  width:100%;text-align:left}
.wf .ln:active{background:var(--bg3)}
.wf .dot{width:8px;height:8px;border-radius:3px;flex:0 0 auto}
.wf .nm{flex:1;font-size:14px;min-width:0}
.wf .nm small{display:block;color:var(--tx3);font-size:11.5px;margin-top:1px}
.wf .vl{font-variant-numeric:tabular-nums;font-weight:620;font-size:14.5px;white-space:nowrap}
.wf .vl{min-width:84px;text-align:right;flex:0 0 auto}
.wf .ln{gap:10px;padding:12px 14px}
.wf .nm{font-size:14px;line-height:1.25}
.wf .nm small{font-size:11.5px;line-height:1.3}
.wf .ln.tot{background:var(--bg3)}
.wf .ln.tot .nm{font-weight:680} .wf .ln.tot .vl{font-size:17px;font-weight:720}
.chev{color:var(--tx3);font-size:13px;margin-left:2px;transition:transform .2s;display:inline-block}
.ln.aberta .chev{transform:rotate(90deg);color:var(--tx2)}
.ln.aberta{background:var(--bg3)}
/* gaveta que abre embaixo da linha, sem pop-up */
.gav{border-top:1px solid var(--line);background:rgba(0,0,0,.18);padding:4px 15px 12px}
.gav .gl{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13px;
  border-bottom:1px solid rgba(255,255,255,.05)}
.gav .gl:last-of-type{border-bottom:0}
.gav .gl b{font-variant-numeric:tabular-nums;font-weight:620}
.gav .gl .nm{color:var(--tx2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gav .mais{margin-top:8px;font-size:12.5px;color:var(--blue);font-weight:600;padding:6px 0}
.gav .barra{height:3px;border-radius:2px;background:var(--bg3);margin-top:5px;overflow:hidden}
.gav .barra i{display:block;height:100%;background:var(--blue);border-radius:2px}

/* ---------- kpis ---------- */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:13px;text-align:left}
.kpi:active{background:var(--bg3)}
.kpi .k{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--tx2);font-weight:550}
.kpi .v{display:block;font-size:21px;font-weight:700;letter-spacing:-.7px;margin-top:4px;
  font-variant-numeric:tabular-nums}
.kpi .d{display:block;font-size:11.5px;color:var(--tx3);margin-top:2px;line-height:1.3}

/* ---------- grafico ---------- */
.chart{padding:14px 6px 8px}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;padding:0 8px}
.bar{flex:1;min-width:5px;display:flex;flex-direction:column;justify-content:flex-end;
  height:100%;position:relative;border-radius:4px 4px 0 0}
.bar:active{background:rgba(255,255,255,.05)}
/* align-self:stretch em vez de width:100% — dentro de um flex item com flex-basis:0
   a porcentagem resolve pra zero e a barra some */
.bar .fill{align-self:stretch;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
.bar .fill.lucro{background:var(--green)} .bar .fill.perda{background:var(--red)}
.bar.sel .fill{outline:2px solid var(--tx);outline-offset:1px}
.bar .tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  background:var(--tx);color:#0d0f14;font-size:11px;font-weight:650;padding:3px 7px;border-radius:6px;
  white-space:nowrap;opacity:0;pointer-events:none;margin-bottom:4px;z-index:5}
.bar.sel .tip{opacity:1}
.xax{display:flex;gap:3px;padding:6px 8px 0}
.xax span{flex:1;min-width:5px;font-size:9.5px;color:var(--tx3);text-align:center;overflow:hidden;white-space:nowrap}

/* ---------- listas ---------- */
.row{display:flex;align-items:center;gap:12px;padding:12px 15px;border-top:1px solid var(--line);
  width:100%;text-align:left}
.card>.row:first-child{border-top:0}
.row:active{background:var(--bg3)}
.row .ic{width:34px;height:34px;border-radius:10px;background:var(--bg3);display:grid;place-items:center;
  font-size:14px;flex:0 0 auto}
.row .mid{flex:1;min-width:0}
.row .t{display:block;font-size:14px;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{display:block;font-size:11.5px;color:var(--tx3);margin-top:1px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.row .rt{text-align:right;flex:0 0 auto}
.row .rt .a{font-size:14px;font-weight:640;font-variant-numeric:tabular-nums;display:block}
.row .rt .b{font-size:11.5px;margin-top:1px;font-variant-numeric:tabular-nums;display:block}
.pb{height:4px;border-radius:2px;background:var(--bg3);margin-top:6px;overflow:hidden}
.pb i{display:block;height:100%;border-radius:2px;background:var(--blue)}

/* ---------- sheet ---------- */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;opacity:0;pointer-events:none;
  transition:opacity .2s;backdrop-filter:blur(2px)}
.ovl.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg2);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  max-height:88dvh;overflow-y:auto;transform:translateY(102%);
  transition:transform .26s cubic-bezier(.3,.8,.4,1);
  padding-bottom:calc(20px + var(--safe));-webkit-overflow-scrolling:touch}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 4px}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:8px 16px 12px;position:sticky;top:0;
  background:var(--bg2);z-index:2;border-bottom:1px solid var(--line)}
.sheet .sh h3{margin:0;font-size:16px;font-weight:680;flex:1;letter-spacing:-.2px}
.sheet .sh .x{width:30px;height:30px;border-radius:9px;background:var(--bg3);display:grid;place-items:center;
  color:var(--tx2);font-size:15px}
.sheet .body{padding:14px 16px;max-width:720px;margin:0 auto}
.sheet .sh{max-width:720px;margin:0 auto}
.dl{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.dl:last-child{border-bottom:0}
.dl dt{color:var(--tx2);margin:0} .dl dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}

/* ---------- form ---------- */
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:12px;color:var(--tx2);margin-bottom:5px;font-weight:550}
label.f input{width:100%;background:var(--bg3);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;font-size:16px}
.btn{display:block;width:100%;background:var(--red);color:#fff;border-radius:12px;padding:13px;
  font-weight:650;text-align:center;margin-top:6px}
.btn.g{background:var(--bg3);color:var(--tx)}
.inl{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:6px 9px;
  width:92px;text-align:right;font-size:14px;font-variant-numeric:tabular-nums}

nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:rgba(13,15,20,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding-bottom:var(--safe)}
nav button{flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--tx3);font-size:10px;font-weight:560}
nav button .n{font-size:19px;line-height:1}
nav button.on{color:var(--tx)}

.empty{text-align:center;color:var(--tx3);padding:34px 16px;font-size:14px}
.tag{display:inline-block;font-size:10.5px;font-weight:620;padding:2px 7px;border-radius:5px;
  background:var(--bg3);color:var(--tx2);vertical-align:middle}
.note{font-size:12px;color:var(--tx3);line-height:1.55;padding:11px 13px;background:var(--bg3);
  border-radius:10px;margin-top:12px}
.note b{color:var(--tx2)}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--safe));transform:translate(-50%,14px);
  background:var(--tx);color:#0d0f14;padding:10px 16px;border-radius:11px;font-size:13.5px;font-weight:620;
  z-index:80;opacity:0;pointer-events:none;transition:all .22s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>Painel Brochevique</h1>
    <p>Vendas, custos e lucro em tempo real</p>
    <input id="em" type="email" placeholder="e-mail" autocomplete="username">
    <input id="pw" type="password" placeholder="senha" autocomplete="current-password">
    <button id="entrar">Entrar</button>
    <div id="erro"></div>
  </div>
</div>

<div id="app" class="hide">
  <header>
    <div class="hd">
      <div class="ico">📊</div>
      <h1><span id="tit">Resumo</span><span class="sub" id="sub">—</span></h1>
      <button class="ico" id="btSync" title="Recarregar">⟳</button>
    </div>
    <div class="chips" id="chipsPer"></div>
  </header>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>

<div class="ovl" id="ovl"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="sh"><h3 id="shTit"></h3><button class="x" id="shX">✕</button></div>
  <div class="body" id="shBody"></div>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================ config ==== */
const SUPABASE_URL = "https://eyfhdyairinbapjqolpn.supabase.co";
const SUPABASE_KEY = "sb_publishable_T5KGf7wMcImPMjtYKOiFxA_3-RR-tSx";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============================================================ helpers === */
const $  = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const brl  = n => (n<0?"−":"")+"R$ "+Math.abs(n||0).toLocaleString("pt-BR",{maximumFractionDigits:0});
const brl2 = n => (n<0?"−":"")+"R$ "+Math.abs(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct  = n => (n>=0?"":"−")+Math.abs(n).toFixed(Math.abs(n)>=100?0:1).replace(".",",")+"%";
const num  = n => (n||0).toLocaleString("pt-BR",{maximumFractionDigits:0});
const iso  = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const hojeISO = () => iso(new Date());
const dbr  = s => s ? s.slice(8,10)+"/"+s.slice(5,7) : "";
const MES  = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const esc  = s => String(s??"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove("on"),2200); }
function segunda(s){ const d=new Date(s+"T12:00:00"); const w=(d.getDay()+6)%7;
  d.setDate(d.getDate()-w); return iso(d); }

/* ============================================================ estado ==== */
const S = { view:"resumo", periodo:"30d", frete:"com", gran:"dia",
            grupo:null, canal:null, sel:null, voltar:null };
const D = { pedidos:[], itens:[], itensPor:{}, ads:[], fixos:[], produtos:[],
            emprestimos:[], parcelas:[], estoque:[], compras:[], eventos:[], evPor:{}, par:{} };

/* ============================================================ carga ===== */
async function carregar(){
  /* PostgREST corta em 1000 linhas por resposta — busca em paginas ate acabar */
  const q = async (t,ord)=>{
    const PAG=1000; let de=0, tudo=[];
    for(;;){
      let r = sb.from(t).select("*");
      if(ord) r = r.order(ord);
      const {data,error} = await r.range(de,de+PAG-1);
      if(error) throw error;
      tudo = tudo.concat(data||[]);
      if(!data || data.length<PAG) return tudo;
      de += PAG;
      if(de>50000) return tudo;
    }
  };
  const [pedidos,itens,ads,fixos,produtos,emp,parc,est,par,compras,eventos] = await Promise.all([
    q("fin_pedidos","data"), q("fin_pedido_itens"), q("fin_ads","data"),
    q("fin_custos_fixos"), q("fin_produtos"), q("fin_emprestimos"),
    q("fin_parcelas","vencimento"), q("fin_estoque"), q("fin_parametros"),
    q("fin_compras","data"), q("fin_eventos","data"),
  ]);
  D.eventos = (eventos||[]).map(e=>({...e,
    comissao_pct:+e.comissao_pct||0, custo_extra:+e.custo_extra||0}));
  D.evPor = {}; D.eventos.forEach(e=>D.evPor[e.data]=e);
  D.compras = compras.map(c=>({...c, valor:+c.valor||0}));
  const f = v => +v||0;
  D.pedidos = pedidos.map(p=>({...p, bruto:f(p.bruto), frete_cobrado:f(p.frete_cobrado),
    frete_pago:f(p.frete_pago), desconto:f(p.desconto), taxa:f(p.taxa),
    comissao:f(p.comissao), cogs:f(p.cogs), qtd:f(p.qtd) }));
  D.itens = itens.map(i=>({...i, qtd:f(i.qtd), preco_un:f(i.preco_un), custo_un:f(i.custo_un)}));
  D.ads = ads.map(a=>({...a, gasto:f(a.gasto), cliques:f(a.cliques), impressoes:f(a.impressoes)}));
  D.fixos=fixos; D.produtos=produtos; D.emprestimos=emp; D.parcelas=parc; D.estoque=est;
  D.par={}; par.forEach(p=>D.par[p.chave]=p);
  D.itensPor={}; D.itens.forEach(i=>{ (D.itensPor[i.pedido_id] ||= []).push(i); });
}

/* ==================================================== periodo / filtro == */
function faixa(){
  const hj = hojeISO();
  const menos = n => { const d=new Date(hj+"T12:00:00"); d.setDate(d.getDate()-n); return iso(d); };
  switch(S.periodo){
    case "hoje": return [hj,hj,"Hoje"];
    case "7d":   return [menos(6),hj,"Últimos 7 dias"];
    case "30d":  return [menos(29),hj,"Últimos 30 dias"];
    case "mes":  return [hj.slice(0,8)+"01",hj,"Mês atual ("+MES[+hj.slice(5,7)-1]+")"];
    /* "tudo" vai ate a ultima data que existe — nao para em hoje (fuso, venda de madrugada) */
    default:     return ["2000-01-01", D.pedidos.reduce((a,p)=>p.data>a?p.data:a,hj), "Tudo"];
  }
}
function faixaAnterior(){
  if(S.periodo==="tudo") return null;
  const [a,b] = faixa();
  const d1=new Date(a+"T12:00:00"), d2=new Date(b+"T12:00:00");
  const dias = Math.round((d2-d1)/864e5)+1;
  const f2=new Date(d1); f2.setDate(f2.getDate()-1);
  const f1=new Date(f2); f1.setDate(f1.getDate()-dias+1);
  return [iso(f1),iso(f2),"anterior"];
}
/* status "pendente" = Pix direto ainda nao classificado. Fica fora de TODO total
   ate voce dizer o que e, na aba Triagem. */
const vale = p => p.status!=="pendente" && p.canal!=="a_classificar";
const noPer = (p,f) => vale(p) && p.data>=f[0] && p.data<=f[1]
  && (!S.grupo || grupoDe(p)===S.grupo) && (!S.canal || p.canal===S.canal);
const pedidosDe = f => D.pedidos.filter(p=>noPer(p,f));
/* ADs sao do site: se voce filtrou rua ou atacado, nao faz sentido descontar */
const adsDe = f => temAds(S.grupo) ? D.ads.filter(x=>x.data>=f[0] && x.data<=f[1]) : [];
const pendentes = () => D.pedidos.filter(p=>p.status==="pendente");

/* ==================================================== nucleo financeiro = */
function receita(p){
  const prod = p.bruto - p.desconto;
  if(S.frete==="produto") return prod;
  if(S.frete==="liquido") return prod + p.frete_cobrado - p.frete_pago;
  return prod + p.frete_cobrado;
}
/* margem de contribuicao: a verdade, nao muda com o modo de exibicao */
function margem(p){
  return (p.bruto - p.desconto + p.frete_cobrado) - p.frete_pago - p.taxa - p.cogs - p.comissao;
}
function totais(f){
  const ps = pedidosDe(f), ads = adsDe(f);
  const t = { n:ps.length, qtd:0, prod:0, freteCob:0, fretePago:0, desconto:0,
              taxa:0, cogs:0, comissao:0, receita:0, margem:0 };
  ps.forEach(p=>{
    t.qtd+=p.qtd; t.prod+=p.bruto-p.desconto; t.freteCob+=p.frete_cobrado;
    t.fretePago+=p.frete_pago; t.desconto+=p.desconto; t.taxa+=p.taxa;
    t.cogs+=p.cogs; t.comissao+=p.comissao;
    t.receita+=receita(p); t.margem+=margem(p);
  });
  t.ads     = ads.reduce((s,a)=>s+a.gasto,0);
  t.cliques = ads.reduce((s,a)=>s+a.cliques,0);
  t.caixa   = t.prod + t.freteCob;
  /* custo do ato que nao e produto: transporte, quem filmou, ajudante */
  t.custoEvento = (!S.grupo || S.grupo==="evento")
    ? D.eventos.filter(e=>e.data>=f[0] && e.data<=f[1]).reduce((s,e)=>s+e.custo_extra,0) : 0;
  t.margem -= t.custoEvento;
  t.lucro   = t.margem - t.ads;
  t.mg      = t.receita ? t.lucro/t.receita*100 : 0;
  t.ticket  = t.n ? t.caixa/t.n : 0;
  t.roas    = t.ads ? t.caixa/t.ads : 0;
  return t;
}
function fixoNoPeriodo(f){
  /* em "Tudo" a faixa comeca em 2000 — usa a data do 1o pedido, senao o rateio explode */
  const primeiro = D.pedidos.length ? D.pedidos.reduce((a,p)=>p.data<a?p.data:a, D.pedidos[0].data) : f[0];
  const ini = f[0] > primeiro ? f[0] : primeiro;
  const dias = Math.max(1, Math.round((new Date(f[1]+"T12:00:00")-new Date(ini+"T12:00:00"))/864e5)+1);
  const mensal = D.fixos.filter(x=>x.ativo!==false).reduce((s,x)=>s+(+x.valor_mensal||0),0);
  return mensal/30*dias;
}

/* ==================================================== agrupamento ======= */
const chaveGran = d => S.gran==="dia" ? d : S.gran==="semana" ? segunda(d) : d.slice(0,7);
function serie(f){
  const out = {};
  pedidosDe(f).forEach(p=>{
    const k = chaveGran(p.data);
    (out[k] ||= {k,receita:0,margem:0,n:0,ads:0});
    out[k].receita+=receita(p); out[k].margem+=margem(p); out[k].n++;
  });
  adsDe(f).forEach(a=>{
    const k = chaveGran(a.data);
    (out[k] ||= {k,receita:0,margem:0,n:0,ads:0}); out[k].ads+=a.gasto;
  });
  const arr = Object.values(out).sort((x,y)=>x.k<y.k?-1:1);
  arr.forEach(x=>x.lucro=x.margem-x.ads);
  return arr;
}
function rotulo(k){
  if(S.gran==="mes") return MES[+k.slice(5,7)-1]+"/"+k.slice(2,4);
  return k.slice(8,10)+"/"+k.slice(5,7);
}

              atacado:"📦",a_classificar:"❓"};

              dinheiro:"Dinheiro",checkout_mp:"Link / Checkout MP",
              atacado:"Atacado (WhatsApp)",a_classificar:"A classificar"};
/* 3 frentes, no jeito que o Felipe pensa o negocio:
   ONLINE = site + outras plataformas (link MP, e no futuro Shopee/TikTok)
   EVENTO = ato/rua — aqui o que conta e o EVENTO inteiro, nao cada Pix de R$5

const temAds  = g => !g || g==="online";

/* transportadora-mae: o que importa primeiro e Correios x Melhor Envio, nao o servico */
function transportadora(obs){
  const t=(obs||"").replace(/^#\d+\s*/,"");
  if(!t) return "Sem frete";
  if(/via Melhor Envio/i.test(t)) return "Melhor Envio";
  if(/^Nuvem Envio/i.test(t))     return "Nuvem Envio";
  if(/Correios/i.test(t))         return "Correios";
  if(/Retirar/i.test(t))          return "Retirada";
  return "Outros";
}
/* no resumo de custo o que importa e a familia, nao o modelo:
   40 linhas de "Broche X" viram uma linha "Broches" (o detalhe fica no + ) */
function familia(nome){
  const n=(nome||"").toLowerCase();
  if(n.includes("broche")||n.includes("boton")) return "Broches";
  if(n.includes("kit 6 copos")||n.includes("copo")) return "Copos";
  if(n.startsWith("pin")||n.includes(" pin ")) return "Pins";
  if(n.includes("almofada")) return "Almofadas";
  if(n.includes("ima")||n.includes("ímã")||n.includes("chaveiro")||n.includes("abridor")) return "Ímãs e chaveiros";
  if(n.includes("bon")) return "Bonés";
  return "Outros";
}
const FICON={Broches:"🔴",Copos:"🥤",Pins:"📌",Almofadas:"🧸","Ímãs e chaveiros":"🔑",Bonés:"🧢",Outros:"📦"};
const servico = obs => (obs||"").replace(/^#\d+\s*/,"").replace(/\s*\(via Melhor Envio\)/i,"") || "—";

/* ==================================================== gaveta (inline) === */
/* Regra do painel: o PRIMEIRO numero e sempre o unificado. O detalhe abre numa
   gaveta aqui mesmo (sem pop-up). O pop-up e so pro "ver tudo" — nivel 3. */
function gaveta(itens, verTudo, rotuloTudo){
  const g = el("div","gav");
  const max = Math.max(...itens.map(i=>Math.abs(i.v||0)),1);
  itens.forEach(i=>{
    const l = el("div","gl");
    l.innerHTML = `<span class="nm">${esc(i.n)}</span><b class="${i.cls||""}">${i.t||brl(i.v)}</b>`;
    if(i.onclick){ l.style.cursor="pointer"; l.onclick=e=>{e.stopPropagation(); i.onclick();}; }
    g.append(l);
    if(i.barra!==false){
      const b=el("div","barra"); b.innerHTML=`<i style="width:${Math.abs(i.v||0)/max*100}%"></i>`;
      g.append(b);
    }
  });
  if(!itens.length) g.append(el("div","gl",'<span class="nm">nada no período</span>'));
  if(verTudo){
    const b = el("button","mais", (rotuloTudo||"Ver tudo")+" ›");
    b.onclick = e=>{ e.stopPropagation(); verTudo(); };
    g.append(b);
  }
  return g;
}
/* linha da cascata: toca e abre a gaveta embaixo, sem sair da tela */
function lnCascata({dot,nome,sub,val,neg,base,itens,verTudo,rotuloTudo,total}){
  const wrap = el("div");
  const b = el("button","ln"+(total?" tot":""));
  const p2 = base ? pct(val/base*100) : "";
  const sub2 = [p2, sub].filter(Boolean).join(" · ");
  b.innerHTML = `<span class="dot" style="background:${dot}"></span>
    <span class="nm">${nome}${sub2?`<small>${sub2}</small>`:""}</span>
    <span class="vl ${neg?"neg":(val<0?"neg":"")}">${neg?"−":""}${brl(Math.abs(val))}</span>
    ${itens?'<span class="chev">›</span>':""}`;
  wrap.append(b);
  if(itens){
    let aberta=false, g=null;
    b.onclick=()=>{
      aberta=!aberta; b.classList.toggle("aberta",aberta);
      if(aberta){ g=gaveta(itens,verTudo,rotuloTudo); wrap.append(g); }
      else if(g){ g.remove(); g=null; }
    };
  } else b.style.cursor="default";
  return wrap;
}

/* ==================================================== quebras =========== */
function porGrupo(f){
  const o={};
  pedidosDe(f).forEach(p=>{
    const g=grupoDe(p); (o[g] ||= {n:0,r:0,m:0,cogs:0,qtd:0,taxa:0});
    o[g].n++; o[g].r+=receita(p); o[g].m+=margem(p);
    o[g].cogs+=p.cogs; o[g].qtd+=p.qtd; o[g].taxa+=p.taxa;
  });
  return o;
}
function porFamilia(f){
  const ids=new Set(pedidosDe(f).map(p=>p.id)), o={};
  D.itens.forEach(i=>{ if(!ids.has(i.pedido_id)) return;
    const k=familia(i.produto); (o[k] ||= {q:0,r:0,c:0});
    o[k].q+=i.qtd; o[k].r+=i.qtd*i.preco_un; o[k].c+=i.qtd*i.custo_un; });
  const semItem=pedidosDe(f).filter(p=>!(D.itensPor[p.id]||[]).length).reduce((s,p)=>s+p.cogs,0);
  if(semItem>0) o["Atos (custo estimado)"]={q:0,r:0,c:semItem};
  return o;
}
function porTransportadora(f){
  const o={};
  pedidosDe(f).forEach(p=>{ if(!p.frete_pago && !p.frete_cobrado) return;
    const k=transportadora(p.obs); (o[k] ||= {n:0,c:0,p:0});
    o[k].n++; o[k].c+=p.frete_cobrado; o[k].p+=p.frete_pago; });
  return o;
}
/* Um ATO e uma unidade: nao 300 Pix de R$5, mas um evento com resultado proprio. */
function eventosDe(f){
  const dias={};
  pedidosDe(f).filter(p=>grupoDe(p)==="evento").forEach(p=>{
    (dias[p.data] ||= {data:p.data,n:0,bruto:0,margem:0,cogs:0,com:0,taxa:0,porCanal:{}});
    const d=dias[p.data];
    d.n++; d.bruto+=p.bruto; d.margem+=margem(p); d.cogs+=p.cogs;
    d.com+=p.comissao; d.taxa+=p.taxa;
    d.porCanal[p.canal]=(d.porCanal[p.canal]||0)+p.bruto;
  });
  const lista = Object.values(dias).map(d=>{
    const e=D.evPor[d.data]||{};
    const extra=+e.custo_extra||0;
    return {...d, nome:e.nome||("Ato de "+dbr(d.data)), local:e.local||"", vendedor:e.vendedor||"",
            pct:+e.comissao_pct||0, extra, extraDesc:e.custo_desc||"", ev:e,
            resultado:d.margem-extra,
            /* dia com 2 vendinhas nao e um ato: so vira ato com movimento de verdade
               (ou se voce ja deu nome pra ele) */
            eAto: d.n>=5 || d.bruto>=150 || !!(e.nome && !/confirmar/i.test(e.nome))};
  });
  const atos=lista.filter(x=>x.eAto).sort((a,b)=>a.data<b.data?1:-1);
  const miudos=lista.filter(x=>!x.eAto);
  if(miudos.length){
    const j=miudos.reduce((a,x)=>({n:a.n+x.n,bruto:a.bruto+x.bruto,margem:a.margem+x.margem,
      cogs:a.cogs+x.cogs,com:a.com+x.com,taxa:a.taxa+x.taxa}),
      {n:0,bruto:0,margem:0,cogs:0,com:0,taxa:0});
    const canais={}; miudos.forEach(x=>Object.entries(x.porCanal)
      .forEach(([k,v])=>canais[k]=(canais[k]||0)+v));
    atos.push({...j, data:miudos[miudos.length-1].data, porCanal:canais, avulso:true,
      nome:`Vendas avulsas na rua (${miudos.length} dias)`, local:"", vendedor:"",
      pct:0, extra:0, extraDesc:"", ev:{}, resultado:j.margem, eAto:false});
  }
  return atos;
}
const somaFixos = () => D.fixos.filter(x=>x.ativo!==false).reduce((s,x)=>s+(+x.valor_mensal||0),0);

function alertas(f,t){
  const out=[];
  const gap=t.fretePago-t.freteCob;
  if(gap>0) out.push(linha({ic:"🚚",t:"Frete no prejuízo",
    s:`paguei ${brl(t.fretePago)} e cobrei ${brl(t.freteCob)}`,
    a:`<span class="neg">−${brl(gap)}</span>`,onclick:()=>detFrete(f)}));
  if(t.ads>0 && t.ads>t.margem) out.push(linha({ic:"📣",t:"ADs maiores que a margem",
    s:`ADs ${brl(t.ads)} · margem ${brl(t.margem)}`,
    a:`<span class="neg">${brl(t.margem-t.ads)}</span>`,
    onclick:()=>{S.view="custos";render();}}));
  const semNome=eventosDe(f).filter(e=>/confirmar/i.test(e.nome));
  if(semNome.length) out.push(linha({ic:"📍",t:`${semNome.length} atos sem nome`,
    s:"a lista de eventos está defasada",a:"›",
    onclick:()=>{S.view="atos";window.scrollTo(0,0);render();}}));
  return out;
}

function detFrete(f){
  const ps=pedidosDe(f).filter(p=>p.frete_pago||p.frete_cobrado);
  const cob=ps.reduce((s,p)=>s+p.frete_cobrado,0), pag=ps.reduce((s,p)=>s+p.frete_pago,0);
  const gratis=ps.filter(p=>p.frete_cobrado===0&&p.frete_pago>0);
  const c=el("div");
  c.append(dl([
    ["Frete cobrado dos clientes",brl2(cob)],
    ["Frete pago às transportadoras","−"+brl2(pag),"neg"],
    ["<b>Resultado do frete</b>",`<b class="${cob-pag<0?"neg":"pos"}">${brl2(cob-pag)}</b>`],
    ["Pedidos com frete grátis",num(gratis.length)+" de "+num(ps.length)],
    ["Quanto o frete grátis custou","−"+brl2(gratis.reduce((s,p)=>s+p.frete_pago,0)),"neg"],
  ]));
  const pt=porTransportadora(f);
  const b1=el("div","card"); b1.style.marginTop="14px";
  Object.entries(pt).sort((a,b)=>b[1].p-a[1].p).forEach(([k,v])=>
    b1.append(linha({ic:k==="Correios"?"📮":k==="Melhor Envio"?"🚚":"📦",t:k,
      s:`${v.n} envios · cobrei ${brl(v.c)}`,a:brl2(v.p),
      b:brl2(v.c-v.p),cls:v.c-v.p<0?"neg":"pos"})));
  c.append(el("div","note","<b>Quem levou seu dinheiro.</b> À direita o que você pagou; embaixo o resultado (cobrado − pago)."));
  c.append(b1);
  const sv={};
  ps.forEach(p=>{ const k=servico(p.obs); (sv[k] ||= {n:0,c:0,p:0});
    sv[k].n++; sv[k].c+=p.frete_cobrado; sv[k].p+=p.frete_pago; });
  const b2=el("div","card"); b2.style.marginTop="14px";
  Object.entries(sv).sort((a,b)=>(b[1].p-b[1].c)-(a[1].p-a[1].c)).forEach(([k,v])=>
    b2.append(linha({t:k,s:`${v.n} envios · cobrei ${brl(v.c)}`,a:brl2(v.p),
      b:brl2(v.c-v.p),cls:v.c-v.p<0?"neg":"pos"})));
  c.append(el("div","note","<b>Serviço a serviço</b>, do pior resultado pro melhor."));
  c.append(b2);
  abrir("Frete",c);
}

function detProdutos(f){
  const ids=new Set(pedidosDe(f).map(p=>p.id)), agg={};
  D.itens.forEach(i=>{ if(!ids.has(i.pedido_id)) return;
    const k=i.produto||"—"; (agg[k] ||= {q:0,r:0,c:0,fam:familia(i.produto)});
    agg[k].q+=i.qtd; agg[k].r+=i.qtd*i.preco_un; agg[k].c+=i.qtd*i.custo_un; });
  const fam={};
  Object.entries(agg).forEach(([k,v])=>{ (fam[v.fam] ||= []).push([k,v]); });
  const c=el("div");
  Object.entries(fam)
    .sort((a,b)=>b[1].reduce((s,x)=>s+x[1].r,0)-a[1].reduce((s,x)=>s+x[1].r,0))
    .forEach(([k,lista])=>{
      const r=lista.reduce((s,x)=>s+x[1].r,0), cu=lista.reduce((s,x)=>s+x[1].c,0);
      const q=lista.reduce((s,x)=>s+x[1].q,0);
      c.append(el("div","note",
        `<b>${FICON[k]||"📦"} ${k}</b> — ${num(q)} un · ${brl2(r)} · margem ${pct(r?(r-cu)/r*100:0)}`));
      const box=el("div","card"); box.style.marginTop="6px";
      lista.sort((a,b)=>b[1].r-a[1].r).forEach(([n,v])=>box.append(linha({t:n,
        s:`${num(v.q)} un · custo ${brl2(v.c)}`,a:brl2(v.r),
        b:"margem "+pct(v.r?(v.r-v.c)/v.r*100:0),cls:"pos"})));
      c.append(box);
    });
  if(!Object.keys(fam).length) c.append(el("div","empty","Só os pedidos online registram item a item."));
  c.append(el("div","note","Item a item existe só nos pedidos <b>online</b>. Nos atos o Mercado Pago não informa o produto — lá o custo entra por percentual."));
  abrir("Produtos vendidos",c);
}

  if(S.grupo){

    <div class="meta">
      <span class="pill">${num(evs.length)} ato${evs.length===1?"":"s"}</span>
      <span class="pill ${tot.r<0?"neg":"pos"}">sobrou ${brl(tot.r)}</span>
      <span class="pill">média ${brl(evs.length?tot.b/evs.length:0)}</span>
    </div>`;
  hero.append(h); m.append(hero);

  const s=el("div","sec"); s.style.marginTop="18px";
  s.append(el("h2",null,"Cada ato",'<span class="r">toque p/ editar</span>'));
  const c=el("div","card");
  const maxB=Math.max(...evs.map(e=>e.bruto),1);
  evs.forEach(e=>{
    const r=linha({ic:e.avulso?"·":/confirmar/i.test(e.nome)?"❓":"📍",t:e.nome,
      s:e.avulso?`${e.n} vendas soltas`
        :`${dbr(e.data)}${e.vendedor?" · "+e.vendedor:""}${e.local?" · "+e.local:""} · ticket ${brl2(e.n?e.bruto/e.n:0)}`,
      a:brl(e.bruto),b:brl(e.resultado)+" sobrou",cls:e.resultado<0?"neg":"pos",
      onclick:()=>detEvento(e)});
    const pb=el("div","pb"); pb.innerHTML=`<i style="width:${e.bruto/maxB*100}%"></i>`;
    r.querySelector(".mid").append(pb);
    c.append(r);
  });
  if(!evs.length) c.append(el("div","empty","Nenhum ato nesse período."));
  s.append(c); m.append(s);

  const b=el("button","btn","+ Registrar ato / venda em dinheiro");
  b.style.marginTop="12px"; b.onclick=formVenda; m.append(b);

  return m;
}
function detEvento(e){
  const c=el("div");
  if(e.avulso){
    c.append(el("div","note","Estes são dias soltos com pouca venda na rua — o painel junta todos numa linha só pra não poluir a lista de atos. Se algum deles foi um ato de verdade, lance pelo botão <b>+ Registrar ato</b>."));
  }
  c.append(dl([
    ["Faturamento",brl2(e.bruto)],
    ["Custo do produto","−"+brl2(e.cogs),"neg"],
    e.taxa?["Taxas de cartão/Pix","−"+brl2(e.taxa),"neg"]:null,
    e.com?[`Comissão${e.vendedor?" — "+esc(e.vendedor):""} (${pct(e.pct)})`,"−"+brl2(e.com),"neg"]:null,
    e.extra?[esc(e.extraDesc||"Despesas do dia"),"−"+brl2(e.extra),"neg"]:null,
    ["<b>Sobrou</b>",`<b class="${e.resultado<0?"neg":"pos"}">${brl2(e.resultado)}</b>`],
    ["Vendas",num(e.n)],
    ["Ticket médio",brl2(e.n?e.bruto/e.n:0)],
  ]));
  /* como recebeu: SO aqui, no detalhe */
  const box=el("div","card"); box.style.marginTop="14px";
  Object.entries(e.porCanal).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>
    box.append(linha({ic:ICON[k]||"•",t:NOME[k]||k,a:brl2(v),
      b:pct(e.bruto?v/e.bruto*100:0)})));
  c.append(el("div","note","Como o dinheiro entrou:"));
  c.append(box);

  /* edicao */
  if(e.avulso){ abrir(e.nome,c); return; }
  const campos=[["nome","Nome do ato","text",e.nome],["local","Local","text",e.local],
    ["vendedor","Quem vendeu","text",e.vendedor],
    ["comissao_pct","Comissão (%)","number",e.pct],
    ["custo_extra","Outras despesas (R$)","number",e.extra],
    ["custo_desc","O que foi essa despesa","text",e.extraDesc]];
  const ins={};
  const form=el("div"); form.style.marginTop="16px";
  campos.forEach(([k,l,t,v])=>{
    const lb=el("label","f",`<span>${l}</span>`); const i=el("input");
    i.type=t; i.value=v??""; if(t==="number") i.step="0.01";
    lb.append(i); ins[k]=i; form.append(lb);
  });
  const bt=el("button","btn","Salvar ato");
  bt.onclick=async()=>{
    const payload={data:e.data, nome:ins.nome.value||null, local:ins.local.value||null,
      vendedor:ins.vendedor.value||null, comissao_pct:+ins.comissao_pct.value||0,
      custo_extra:+ins.custo_extra.value||0, custo_desc:ins.custo_desc.value||null};
    const {error}=await sb.from("fin_eventos").upsert(payload,{onConflict:"data"});
    if(error) return toast("Erro: "+error.message);
    /* a comissao vive no pedido; recalcula os do dia com o novo % */
    const pct2=+ins.comissao_pct.value||0;
    const alvo=D.pedidos.filter(p=>p.data===e.data&&grupoDe(p)==="evento");
    await Promise.all(alvo.map(p=>sb.from("fin_pedidos")
      .update({comissao:+(p.bruto*pct2/100).toFixed(2), evento:ins.nome.value||null}).eq("id",p.id)));
    fechar(); toast("Ato salvo"); await carregar(); render();
  };
  form.append(bt); c.append(form);
  abrir(e.nome,c);
}

function vTriagem(){
  const m=el("div"), pend=pendentes().slice().sort((a,b)=>a.data<b.data?1:-1);
  m.append(el("div","note",`<b>Pix que caiu direto na conta.</b> O Mercado Pago não diz o que é:
    pode ser atacado fechado no WhatsApp, venda avulsa, empréstimo de família, aporte seu ou
    repasse de gateway. Enquanto não classificar, fica <b>fora de todos os números</b>.
    O palpite ao lado é só um chute pra acelerar.`));

  const total=pend.reduce((s,p)=>s+p.bruto,0);
  const g=el("div","g2"); g.style.margin="14px 0";
  g.append(kpi("❓ Sem classificar",num(pend.length),"de "+num(pendentes().length+
    D.pedidos.filter(p=>p.origem==="mp"&&p.canal==="atacado").length)+" Pix diretos"));
  g.append(kpi("💰 Valor parado",brl(total),"fora da conta"));
  m.append(g);

  const c=el("div","card");
  pend.forEach(p=>{
    const palpite=(p.obs||"").replace("palpite:","");
    const bloco=el("div"); bloco.style.borderTop="1px solid var(--line)";
    bloco.append(linha({ic:"❓",t:brl2(p.bruto),
      s:`${dbr(p.data)}${p.cliente?" · "+p.cliente:""} · palpite: ${palpite}`}));
    const acoes=el("div"); acoes.style.cssText="display:flex;gap:6px;padding:0 15px 12px;flex-wrap:wrap";
    const OP=[["atacado","📦 Atacado","atacado"],["varejo","📱 Venda avulsa","pix_qr"],
              ["emprestimo","🤝 Empréstimo",null],["repasse","🏦 Repasse",null],["ignorar","🚫 Ignorar",null]];
    OP.forEach(([k,rot,canal])=>{
      const b=el("button","chip"+(palpite===k?" alt on":""),rot);
      b.onclick=async()=>{
        const cogsPct=+(D.par.cogs_rua_pct?.valor_num||22);
        const upd = canal
          ? {canal, status:"pago", cogs:+(p.bruto*cogsPct/100).toFixed(2), obs:"classificado: "+k}
          : {canal:"nao_venda", status:"excluido", obs:"classificado: "+k};
        const {error}=await sb.from("fin_pedidos").update(upd).eq("id",p.id);
        if(error) return toast("Erro");
        toast(rot.replace(/^\S+\s/,"")+" ✓");
        await carregar(); render();
      };
      acoes.append(b);
    });
    bloco.append(acoes); c.append(bloco);
  });
  if(!pend.length) c.append(el("div","empty","Tudo classificado. 🎉"));
  m.append(c);
  return m;
}

    a:brl2(r),b:brl2(mg)+" · "+pct(r?mg/r*100:0),cls:mg<0?"neg":"pos",
    onclick:()=>detPedido(p)});

function vPedidos(){
  const f=faixa(), t=totais(f), m=el("div");

  m.append(volta);
  m.append(grupoChips([[null,"Tudo"],["online","Online"],["evento","Atos"],["atacado","Atacado"]],
    S.grupo,v=>{S.grupo=v;S.canal=null;render();},true));

  const busca=el("input");
  busca.placeholder="Buscar cliente, evento, nº do pedido…";
  Object.assign(busca.style,{width:"100%",background:"var(--bg2)",border:"1px solid var(--line)",
    borderRadius:"12px",padding:"11px 13px",marginBottom:"12px",fontSize:"16px"});
  m.append(busca);

  const g=el("div","g3"); g.style.marginBottom="12px";
  g.append(kpi("Pedidos",num(t.n)));
  g.append(kpi("Ticket",brl(t.ticket)));
  g.append(kpi("Margem",pct(t.receita?t.margem/t.receita*100:0)));
  m.append(g);

  const cont=el("div","card"); m.append(cont);
  const mais=el("button","btn g","Mostrar mais"); mais.style.marginTop="10px"; m.append(mais);
  let lim=40;
  const pintar=()=>{
    const q=busca.value.trim().toLowerCase();
    const lista = q ? ps.filter(p=>((p.cliente||"")+" "+(p.evento||"")+" "+(p.obs||"")+" "+(p.vendedor||""))
                                    .toLowerCase().includes(q)) : ps;
    cont.innerHTML="";
    if(!lista.length) cont.append(el("div","empty","Nenhum pedido encontrado."));
    lista.slice(0,lim).forEach(p=>cont.append(rowPedido(p)));
    mais.classList.toggle("hide",lista.length<=lim);
    mais.textContent=`Mostrar mais (${Math.max(0,lista.length-lim)} restantes)`;
  };
  busca.oninput=()=>{lim=40;pintar();};
  mais.onclick=()=>{lim+=60;pintar();};
  pintar();
  return m;
}
function detPedido(p){
  const r=p.bruto-p.desconto+p.frete_cobrado, mg=margem(p);
  const c=el("div");

    its.forEach(i=>box.append(linha({t:i.produto,
      s:`${num(i.qtd)} × ${brl2(i.preco_un)} · custo ${brl2(i.custo_un)}`,
      a:brl2(i.qtd*i.preco_un)})));
    c.append(box);
  }
  c.append(dl([
    ["Produtos", brl2(p.bruto)],
    p.desconto?["Desconto","−"+brl2(p.desconto),"neg"]:null,
    p.frete_cobrado?["Frete cobrado","+"+brl2(p.frete_cobrado)]:null,
    ["<b>Cliente pagou</b>","<b>"+brl2(r)+"</b>"],

    p.taxa?["Taxa do pagamento","−"+brl2(p.taxa),"neg"]:null,
    p.comissao?["Comissão","−"+brl2(p.comissao),"neg"]:null,
    ["<b>Margem</b>",`<b class="${mg<0?"neg":"pos"}">${brl2(mg)} · ${pct(r?mg/r*100:0)}</b>`],
  ]));
  const meta=el("div","note");
  meta.innerHTML = `<b>${NOME[p.canal]||p.canal}</b> · ${dbr(p.data)}`
    + (p.hora?" às "+String(p.hora).slice(0,5):"")
    + (p.metodo?" · "+esc(p.metodo):"") + (p.uf?" · "+esc(p.uf):"")
    + (p.obs?"<br>"+esc(p.obs):"") + (p.evento?"<br>📍 "+esc(p.evento):"")
    + (p.vendedor?"<br>🤝 vendedor: "+esc(p.vendedor):"");
  c.append(meta);

  const l=el("label","f","<span>Comissão deste pedido (R$)</span>");
  l.style.marginTop="14px";
  const i=el("input"); i.type="number"; i.step="0.01"; i.value=p.comissao||0;

    if(error) return toast("Erro ao salvar");
    p.comissao=v; toast("Comissão salva"); render();
  };
  l.append(i); c.append(l);
  abrir(p.cliente||NOME[p.canal]||"Pedido", c);
}

    <b>Custo do produto</b>: item a item no online; nos atos, por percentual
    (${D.par.cogs_rua_pct?.valor_num||22}%), porque o MP não informa o produto.<br><br>
    <b>Custos fixos</b> (inclusive a ajudante, ${brl(somaFixos())}/mês) entram rateados por dia
    e já estão descontados do "Sobrou" lá em cima.`));
  s3.append(c3); m.append(s3);
  return m;
}
function detEmprestimo(e){
  const c=el("div");
  c.append(dl([
    ["Credor",esc(e.credor)],
    ["Saldo devedor",brl2(+e.saldo||0)],
    ["Valor original",brl2(+e.valor||0)],
    ["Juros",e.juros_am?pct(+e.juros_am):"sem juros"],
    ["Prazo",e.sem_prazo?"sem prazo":(e.quitar_em?dbr(e.quitar_em):"—")],
    e.quitar_em?["Quitar em",dbr(e.quitar_em)]:null,
    ["Finalidade",esc(e.finalidade||"—")],
    e.quem_paga?["Quem paga",esc(e.quem_paga)]:null,
  ]));
  if(e.observacao) c.append(el("div","note",esc(e.observacao)));
  const rel=D.parcelas.filter(p=>(p.quem_paga||"").toLowerCase().includes((e.credor||"").toLowerCase().split(" ")[0]));
  if(rel.length){
    const box=el("div","card"); box.style.marginTop="14px";
    rel.forEach(p=>box.append(linha({t:`Parcela ${p.numero}`,s:dbr(p.vencimento),
      a:brl2(+p.valor||0),b:p.pago?"paga":"a vencer",cls:p.pago?"pos":""})));
    c.append(box);
  }
  abrir(e.credor,c);
}
function detParcelas(){
  const c=el("div"), naoPagas=D.parcelas.filter(p=>!p.pago);
  const porMes={};
  naoPagas.forEach(p=>{ const k=(p.vencimento||"").slice(0,7);
    (porMes[k] ||= {n:0,v:0}); porMes[k].n++; porMes[k].v+=+p.valor||0; });
  const box=el("div","card");
  Object.entries(porMes).sort().forEach(([k,v])=>
    box.append(linha({ic:"📅",t:MES[+k.slice(5,7)-1]+"/"+k.slice(2,4),
      s:`${v.n} parcela${v.n>1?"s":""}`,a:brl2(v.v)})));
  c.append(el("div","note","Quanto sai por mês:"));
  c.append(box);
  const det=el("div","card"); det.style.marginTop="14px";
  naoPagas.slice().sort((a,b)=>(a.vencimento||"")<(b.vencimento||"")?-1:1).forEach(p=>
    det.append(linha({t:`Parcela ${p.numero}`,s:`${dbr(p.vencimento)}${p.quem_paga?" · "+p.quem_paga:""}`,
      a:brl2(+p.valor||0)})));
  c.append(det);
  abrir("Parcelas a vencer — "+brl(naoPagas.reduce((s,p)=>s+(+p.valor||0),0)),c);
}
function detEquipamento(){
  const eq=D.compras.filter(c=>(c.categoria||"")==="equipamento")
    .sort((a,b)=>b.valor-a.valor);
  const tot=eq.reduce((s,c)=>s+c.valor,0);
  const c=el("div"), box=el("div","card");
  eq.forEach(x=>box.append(linha({ic:"🖥️",t:x.item,
    s:`${x.data?dbr(x.data):"sem data"}${x.fornecedor?" · "+x.fornecedor:""}`,
    a:brl2(x.valor),b:pct(tot?x.valor/tot*100:0)})));
  c.append(box);
  c.append(el("div","note","Equipamento é <b>investimento</b>, não custo de venda: não entra na margem de nenhum pedido. Ele volta pra você em forma de produção, não de estoque."));
  abrir("Equipamentos — "+brl(tot),c);
}

function formVenda(){
  const c=el("div"), ins={};
  [["data","Data","date",hojeISO()],["bruto","Valor total (R$)","number",""],
   ["evento","Evento ou lugar","text",""],["vendedor","Vendedor","text",""],
   ["comissao","Comissão (R$)","number","0"]].forEach(([k,l,t,v])=>{
    const lb=el("label","f",`<span>${l}</span>`); const i=el("input");
    i.type=t; i.value=v; if(t==="number") i.step="0.01";
    lb.append(i); ins[k]=i; c.append(lb);
  });
  const b=el("button","btn","Salvar venda");
  b.onclick=async()=>{
    const bruto=+ins.bruto.value||0;
    if(!bruto) return toast("Informe o valor");
    const cogsPct=+(D.par.cogs_rua_pct?.valor_num||22);
    const {error}=await sb.from("fin_pedidos").insert({
      origem:"manual", origem_id:"m-"+Date.now(), data:ins.data.value, canal:"dinheiro",
      evento:ins.evento.value||null, vendedor:ins.vendedor.value||null,
      bruto, cogs:+(bruto*cogsPct/100).toFixed(2), comissao:+ins.comissao.value||0,
      metodo:"dinheiro", status:"pago"});
    if(error) return toast("Erro: "+error.message);
    if(ins.evento.value){
      await sb.from("fin_eventos").upsert({data:ins.data.value, nome:ins.evento.value,
        vendedor:ins.vendedor.value||null},{onConflict:"data"});
    }
    fechar(); toast("Lançado"); await carregar(); render();
  };
  c.append(b);
  abrir("Venda em dinheiro", c);
}
function formParam(){
  const c=el("div");
  [["cogs_rua_pct","Custo do produto na rua (%)"],
   ["taxa_site_pix_pct","Taxa do site — Pix (%)"],
   ["taxa_site_cartao_pct","Taxa do site — cartão (%)"],
   ["taxa_site_boleto_pct","Taxa do site — boleto (%)"]].forEach(([k,l])=>{
    const p=D.par[k]; if(!p) return;
    const lb=el("label","f",`<span>${l}</span>`); const i=el("input");
    i.type="number"; i.step="0.01"; i.value=+p.valor_num||0;
    i.onchange=async()=>{
      const v=+i.value||0;
      const {error}=await sb.from("fin_parametros").update({valor_num:v}).eq("id",p.id);
      if(error) return toast("Erro ao salvar");
      p.valor_num=v; toast("Salvo — rode o sync p/ recalcular");
    };
    lb.append(i); c.append(lb);
  });
  c.append(el("div","note","Estes valores valem para os próximos cálculos do <b>sync</b>. Os pedidos já gravados mantêm o valor antigo até o próximo sync."));
  abrir("Parâmetros", c);
}
function exportar(){
  const cab=["data","canal","evento","vendedor","cliente","uf","bruto","desconto",
             "frete_cobrado","frete_pago","taxa","cogs","comissao","margem"];
  const linhas=[cab.join(";")];
  D.pedidos.forEach(p=>linhas.push(cab.map(k=>{
    const v = k==="margem" ? margem(p) : p[k];
    return typeof v==="number" ? String(v).replace(".",",") : (v??"");
  }).join(";")));
  const blob=new Blob(["﻿"+linhas.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="brochevique-pedidos.csv"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("CSV baixado");
}

/* ==================================================== render ============ */
const VIEWS = {
  resumo: {t:"Resumo", n:"📊", f:vResumo,  grupo:null},
  vendas: {t:"Vendas", n:"📈", f:vCanal,   grupo:"online"},
  atos:   {t:"Atos",   n:"📍", f:vAtos,    grupo:"evento"},
  custos: {t:"Custos", n:"💸", f:vCustos,  grupo:null},
  mais:   {t:"Mais",   n:"⚙️", f:vMais,    grupo:null},
};
/* telas alcancadas por dentro, sem lugar na barra de baixo */
const VIEWS_OCULTAS = {
  canal:   {t:"Canal",   f:vCanal},
  pedidos: {t:"Pedidos", f:vPedidos},
  triagem: {t:"Triagem", f:vTriagem},
};
const VIEW = k => VIEWS[k] || VIEWS_OCULTAS[k];
function render(){
  const f=faixa();
  const V=VIEW(S.view)||VIEWS.resumo;
  $("#tit").textContent = S.view==="canal"&&S.grupo ? GNOME[S.grupo] : V.t;
  $("#sub").textContent = f[2] + (S.canal?" · "+(NOME[S.canal]||S.canal):"");
  document.title = "Painel Brochevique";
  const cp=$("#chipsPer"); cp.innerHTML="";
  [["hoje","Hoje"],["7d","7 dias"],["30d","30 dias"],["mes","Este mês"],["tudo","Tudo"]].forEach(([v,l])=>{
    const b=el("button","chip"+(S.periodo===v?" on":""),l);
    b.onclick=()=>{S.periodo=v;S.sel=null;render();}; cp.append(b);
  });
  const nv=$("#nav"); nv.innerHTML="";
  const ativa = S.view==="canal"?"vendas" : S.view==="pedidos"?(S.grupo==="evento"?"atos":"vendas") : S.view;
  Object.entries(VIEWS).forEach(([k,v])=>{
    const b=el("button",ativa===k?"on":"",`<span class="n">${v.n}</span>${v.t}`);
    b.onclick=()=>{S.view=k;S.grupo=v.grupo;S.canal=null;S.sel=null;window.scrollTo(0,0);render();};
    nv.append(b);
  });
  const vw=$("#view"); vw.innerHTML="";
  try{ vw.append((VIEW(S.view)||VIEWS.resumo).f()); }
  catch(e){ vw.append(el("div","empty","Erro ao montar a tela: "+esc(e.message))); throw e; }
}

/* ==================================================== boot ============== */
async function boot(){
  $("#login").classList.add("hide"); $("#app").classList.remove("hide");
  try { await carregar(); render(); }
  catch(e){ $("#view").innerHTML=`<div class="empty">Erro ao carregar: ${esc(e.message||e)}</div>`; }
}
$("#ovl").onclick = fechar;
$("#shX").onclick = fechar;
$("#entrar").onclick = async ()=>{
  const b=$("#entrar"); b.textContent="Entrando…"; b.disabled=true;
  const {error} = await sb.auth.signInWithPassword({
    email:$("#em").value.trim(), password:$("#pw").value});
  b.textContent="Entrar"; b.disabled=false;
  if(error){ $("#erro").textContent="E-mail ou senha inválidos."; return; }
  boot();
};
$("#pw").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#entrar").click(); });
$("#btSync").onclick = async ()=>{ toast("Atualizando…"); await carregar(); render(); toast("Atualizado"); };
sb.auth.getSession().then(({data})=>{ if(data.session) boot(); });
</script>
