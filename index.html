<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>Painel Brochevique</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<style>
:root{
  --bg:#0d0f14; --bg2:#141821; --bg3:#1b2029; --line:#252b37;
  --tx:#e8ecf3; --tx2:#98a2b6; --tx3:#5f6a80;
  --red:#e5484d; --green:#3dd68c; --amber:#ffb224; --blue:#5b8def; --purple:#a97bff;
  --r:14px; --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--tx);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  padding-bottom:calc(68px + var(--safe));
  overscroll-behavior-y:contain;
}
button,input,select{font:inherit;color:inherit}
/* o padding padrao do <button> (1px 6px) engolia a largura das barras do grafico */
button{background:none;border:0;padding:0;cursor:pointer}
a{color:var(--blue)}
.hide{display:none !important}

/* ---------- login ---------- */
#login{min-height:100dvh;display:grid;place-items:center;padding:24px}
#login .box{width:100%;max-width:340px;text-align:center}
#login h1{font-size:26px;margin:0 0 4px;letter-spacing:-.5px}
#login p{color:var(--tx2);margin:0 0 24px;font-size:14px}
#login input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;margin-bottom:10px;font-size:16px}
#login button{width:100%;background:var(--red);border-radius:12px;padding:14px;font-weight:650;color:#fff}
#erro{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:30;background:rgba(13,15,20,.86);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.hd h1{font-size:17px;margin:0;font-weight:680;letter-spacing:-.3px;flex:1}
.hd .sub{font-size:11px;color:var(--tx3);font-weight:400;display:block;margin-top:1px}
.ico{width:34px;height:34px;border-radius:10px;background:var(--bg3);display:grid;place-items:center;font-size:15px}

.chips{display:flex;gap:7px;padding:0 16px 11px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:999px;background:var(--bg3);
  color:var(--tx2);font-size:13px;font-weight:550;border:1px solid transparent;white-space:nowrap}
.chip.on{background:var(--tx);color:#0d0f14;font-weight:650}
.chip.alt.on{background:var(--blue);color:#fff}

main{padding:16px 16px 24px;max-width:760px;margin:0 auto}
.sec{margin-bottom:22px}
.sec>h2{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--tx3);
  margin:0 0 9px;font-weight:650;display:flex;align-items:center;gap:8px}
.sec>h2 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12px;color:var(--tx2);font-weight:500}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card+.card{margin-top:10px}

/* ---------- hero ---------- */
.hero{padding:18px 16px 16px;background:linear-gradient(160deg,var(--bg3),var(--bg2))}
.hero .lbl{font-size:12px;color:var(--tx2);font-weight:550;display:flex;align-items:center;gap:6px}
.hero .big{font-size:38px;font-weight:730;letter-spacing:-1.6px;margin:3px 0 0;line-height:1.05}
.hero .meta{display:flex;gap:8px;align-items:baseline;margin-top:7px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:620;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--tx2)}
.pos{color:var(--green)} .neg{color:var(--red)}
.pill.pos{background:rgba(61,214,140,.13);color:var(--green)}
.pill.neg{background:rgba(229,72,77,.13);color:var(--red)}

/* ---------- cascata ---------- */
.wf .ln{display:flex;align-items:center;gap:11px;padding:12px 15px;border-top:1px solid var(--line);
  width:100%;text-align:left}
.wf .ln:active{background:var(--bg3)}
.wf .dot{width:8px;height:8px;border-radius:3px;flex:0 0 auto}
.wf .nm{flex:1;font-size:14px;min-width:0}
.wf .nm small{display:block;color:var(--tx3);font-size:11.5px;margin-top:1px}
.wf .vl{font-variant-numeric:tabular-nums;font-weight:620;font-size:14.5px;white-space:nowrap}
.wf .pc{font-size:11px;color:var(--tx3);width:44px;text-align:right;font-variant-numeric:tabular-nums}
.wf .ln.tot{background:var(--bg3)}
.wf .ln.tot .nm{font-weight:680} .wf .ln.tot .vl{font-size:17px;font-weight:720}
.chev{color:var(--tx3);font-size:11px;margin-left:2px}

/* ---------- kpis ---------- */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:13px;text-align:left}
.kpi:active{background:var(--bg3)}
.kpi .k{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--tx2);font-weight:550}
.kpi .v{display:block;font-size:21px;font-weight:700;letter-spacing:-.7px;margin-top:4px;
  font-variant-numeric:tabular-nums}
.kpi .d{display:block;font-size:11.5px;color:var(--tx3);margin-top:2px;line-height:1.3}

/* ---------- grafico ---------- */
.chart{padding:14px 6px 8px}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;padding:0 8px}
.bar{flex:1;min-width:5px;display:flex;flex-direction:column;justify-content:flex-end;
  height:100%;position:relative;border-radius:4px 4px 0 0}
.bar:active{background:rgba(255,255,255,.05)}
/* align-self:stretch em vez de width:100% — dentro de um flex item com flex-basis:0
   a porcentagem resolve pra zero e a barra some */
.bar .fill{align-self:stretch;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
.bar .fill.lucro{background:var(--green)} .bar .fill.perda{background:var(--red)}
.bar.sel .fill{outline:2px solid var(--tx);outline-offset:1px}
.bar .tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  background:var(--tx);color:#0d0f14;font-size:11px;font-weight:650;padding:3px 7px;border-radius:6px;
  white-space:nowrap;opacity:0;pointer-events:none;margin-bottom:4px;z-index:5}
.bar.sel .tip{opacity:1}
.xax{display:flex;gap:3px;padding:6px 8px 0}
.xax span{flex:1;min-width:5px;font-size:9.5px;color:var(--tx3);text-align:center;overflow:hidden;white-space:nowrap}

/* ---------- listas ---------- */
.row{display:flex;align-items:center;gap:12px;padding:12px 15px;border-top:1px solid var(--line);
  width:100%;text-align:left}
.card>.row:first-child{border-top:0}
.row:active{background:var(--bg3)}
.row .ic{width:34px;height:34px;border-radius:10px;background:var(--bg3);display:grid;place-items:center;
  font-size:14px;flex:0 0 auto}
.row .mid{flex:1;min-width:0}
.row .t{display:block;font-size:14px;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{display:block;font-size:11.5px;color:var(--tx3);margin-top:1px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.row .rt{text-align:right;flex:0 0 auto}
.row .rt .a{font-size:14px;font-weight:640;font-variant-numeric:tabular-nums;display:block}
.row .rt .b{font-size:11.5px;margin-top:1px;font-variant-numeric:tabular-nums;display:block}
.pb{height:4px;border-radius:2px;background:var(--bg3);margin-top:6px;overflow:hidden}
.pb i{display:block;height:100%;border-radius:2px;background:var(--blue)}

/* ---------- sheet ---------- */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;opacity:0;pointer-events:none;
  transition:opacity .2s;backdrop-filter:blur(2px)}
.ovl.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg2);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  max-height:88dvh;overflow-y:auto;transform:translateY(102%);
  transition:transform .26s cubic-bezier(.3,.8,.4,1);
  padding-bottom:calc(20px + var(--safe));-webkit-overflow-scrolling:touch}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 4px}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:8px 16px 12px;position:sticky;top:0;
  background:var(--bg2);z-index:2;border-bottom:1px solid var(--line)}
.sheet .sh h3{margin:0;font-size:16px;font-weight:680;flex:1;letter-spacing:-.2px}
.sheet .sh .x{width:30px;height:30px;border-radius:9px;background:var(--bg3);display:grid;place-items:center;
  color:var(--tx2);font-size:15px}
.sheet .body{padding:14px 16px}
.dl{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.dl:last-child{border-bottom:0}
.dl dt{color:var(--tx2);margin:0} .dl dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}

/* ---------- form ---------- */
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:12px;color:var(--tx2);margin-bottom:5px;font-weight:550}
label.f input{width:100%;background:var(--bg3);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;font-size:16px}
.btn{display:block;width:100%;background:var(--red);color:#fff;border-radius:12px;padding:13px;
  font-weight:650;text-align:center;margin-top:6px}
.btn.g{background:var(--bg3);color:var(--tx)}
.inl{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:6px 9px;
  width:92px;text-align:right;font-size:14px;font-variant-numeric:tabular-nums}

nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:rgba(13,15,20,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding-bottom:var(--safe)}
nav button{flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--tx3);font-size:10px;font-weight:560}
nav button .n{font-size:19px;line-height:1}
nav button.on{color:var(--tx)}

.empty{text-align:center;color:var(--tx3);padding:34px 16px;font-size:14px}
.tag{display:inline-block;font-size:10.5px;font-weight:620;padding:2px 7px;border-radius:5px;
  background:var(--bg3);color:var(--tx2);vertical-align:middle}
.note{font-size:12px;color:var(--tx3);line-height:1.55;padding:11px 13px;background:var(--bg3);
  border-radius:10px;margin-top:12px}
.note b{color:var(--tx2)}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--safe));transform:translate(-50%,14px);
  background:var(--tx);color:#0d0f14;padding:10px 16px;border-radius:11px;font-size:13.5px;font-weight:620;
  z-index:80;opacity:0;pointer-events:none;transition:all .22s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>Painel Brochevique</h1>
    <p>Vendas, custos e lucro em tempo real</p>
    <input id="em" type="email" placeholder="e-mail" autocomplete="username">
    <input id="pw" type="password" placeholder="senha" autocomplete="current-password">
    <button id="entrar">Entrar</button>
    <div id="erro"></div>
  </div>
</div>

<div id="app" class="hide">
  <header>
    <div class="hd">
      <div class="ico">📊</div>
      <h1><span id="tit">Resumo</span><span class="sub" id="sub">—</span></h1>
      <button class="ico" id="btSync" title="Recarregar">⟳</button>
    </div>
    <div class="chips" id="chipsPer"></div>
  </header>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>

<div class="ovl" id="ovl"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="sh"><h3 id="shTit"></h3><button class="x" id="shX">✕</button></div>
  <div class="body" id="shBody"></div>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================ config ==== */
const SUPABASE_URL = "https://eyfhdyairinbapjqolpn.supabase.co";
const SUPABASE_KEY = "sb_publishable_T5KGf7wMcImPMjtYKOiFxA_3-RR-tSx";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============================================================ helpers === */
const $  = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const brl  = n => (n<0?"−":"")+"R$ "+Math.abs(n||0).toLocaleString("pt-BR",{maximumFractionDigits:0});
const brl2 = n => (n<0?"−":"")+"R$ "+Math.abs(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct  = n => (n>=0?"":"−")+Math.abs(n).toFixed(Math.abs(n)>=100?0:1).replace(".",",")+"%";
const num  = n => (n||0).toLocaleString("pt-BR",{maximumFractionDigits:0});
const iso  = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const hojeISO = () => iso(new Date());
const dbr  = s => s ? s.slice(8,10)+"/"+s.slice(5,7) : "";
const MES  = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const esc  = s => String(s??"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove("on"),2200); }
function segunda(s){ const d=new Date(s+"T12:00:00"); const w=(d.getDay()+6)%7;
  d.setDate(d.getDate()-w); return iso(d); }

/* ============================================================ estado ==== */
const S = { view:"resumo", periodo:"30d", frete:"com", gran:"dia", canal:null, sel:null };
const D = { pedidos:[], itens:[], itensPor:{}, ads:[], fixos:[], produtos:[],
            emprestimos:[], parcelas:[], estoque:[], compras:[], par:{} };

/* ============================================================ carga ===== */
async function carregar(){
  /* PostgREST corta em 1000 linhas por resposta — busca em paginas ate acabar */
  const q = async (t,ord)=>{
    const PAG=1000; let de=0, tudo=[];
    for(;;){
      let r = sb.from(t).select("*");
      if(ord) r = r.order(ord);
      const {data,error} = await r.range(de,de+PAG-1);
      if(error) throw error;
      tudo = tudo.concat(data||[]);
      if(!data || data.length<PAG) return tudo;
      de += PAG;
      if(de>50000) return tudo;
    }
  };
  const [pedidos,itens,ads,fixos,produtos,emp,parc,est,par,compras] = await Promise.all([
    q("fin_pedidos","data"), q("fin_pedido_itens"), q("fin_ads","data"),
    q("fin_custos_fixos"), q("fin_produtos"), q("fin_emprestimos"),
    q("fin_parcelas","vencimento"), q("fin_estoque"), q("fin_parametros"),
    q("fin_compras","data"),
  ]);
  D.compras = compras.map(c=>({...c, valor:+c.valor||0}));
  const f = v => +v||0;
  D.pedidos = pedidos.map(p=>({...p, bruto:f(p.bruto), frete_cobrado:f(p.frete_cobrado),
    frete_pago:f(p.frete_pago), desconto:f(p.desconto), taxa:f(p.taxa),
    comissao:f(p.comissao), cogs:f(p.cogs), qtd:f(p.qtd) }));
  D.itens = itens.map(i=>({...i, qtd:f(i.qtd), preco_un:f(i.preco_un), custo_un:f(i.custo_un)}));
  D.ads = ads.map(a=>({...a, gasto:f(a.gasto), cliques:f(a.cliques), impressoes:f(a.impressoes)}));
  D.fixos=fixos; D.produtos=produtos; D.emprestimos=emp; D.parcelas=parc; D.estoque=est;
  D.par={}; par.forEach(p=>D.par[p.chave]=p);
  D.itensPor={}; D.itens.forEach(i=>{ (D.itensPor[i.pedido_id] ||= []).push(i); });
}

/* ==================================================== periodo / filtro == */
function faixa(){
  const hj = hojeISO();
  const menos = n => { const d=new Date(hj+"T12:00:00"); d.setDate(d.getDate()-n); return iso(d); };
  switch(S.periodo){
    case "hoje": return [hj,hj,"Hoje"];
    case "7d":   return [menos(6),hj,"Últimos 7 dias"];
    case "30d":  return [menos(29),hj,"Últimos 30 dias"];
    case "mes":  return [hj.slice(0,8)+"01",hj,"Mês atual ("+MES[+hj.slice(5,7)-1]+")"];
    /* "tudo" vai ate a ultima data que existe — nao para em hoje (fuso, venda de madrugada) */
    default:     return ["2000-01-01", D.pedidos.reduce((a,p)=>p.data>a?p.data:a,hj), "Tudo"];
  }
}
function faixaAnterior(){
  if(S.periodo==="tudo") return null;
  const [a,b] = faixa();
  const d1=new Date(a+"T12:00:00"), d2=new Date(b+"T12:00:00");
  const dias = Math.round((d2-d1)/864e5)+1;
  const f2=new Date(d1); f2.setDate(f2.getDate()-1);
  const f1=new Date(f2); f1.setDate(f1.getDate()-dias+1);
  return [iso(f1),iso(f2),"anterior"];
}
const noPer = (p,f) => p.data>=f[0] && p.data<=f[1] && (!S.canal || p.canal===S.canal);
const pedidosDe = f => D.pedidos.filter(p=>noPer(p,f));
const adsDe = f => D.ads.filter(x=>x.data>=f[0] && x.data<=f[1]);

/* ==================================================== nucleo financeiro = */
function receita(p){
  const prod = p.bruto - p.desconto;
  if(S.frete==="produto") return prod;
  if(S.frete==="liquido") return prod + p.frete_cobrado - p.frete_pago;
  return prod + p.frete_cobrado;
}
/* margem de contribuicao: a verdade, nao muda com o modo de exibicao */
function margem(p){
  return (p.bruto - p.desconto + p.frete_cobrado) - p.frete_pago - p.taxa - p.cogs - p.comissao;
}
function totais(f){
  const ps = pedidosDe(f), ads = adsDe(f);
  const t = { n:ps.length, qtd:0, prod:0, freteCob:0, fretePago:0, desconto:0,
              taxa:0, cogs:0, comissao:0, receita:0, margem:0 };
  ps.forEach(p=>{
    t.qtd+=p.qtd; t.prod+=p.bruto-p.desconto; t.freteCob+=p.frete_cobrado;
    t.fretePago+=p.frete_pago; t.desconto+=p.desconto; t.taxa+=p.taxa;
    t.cogs+=p.cogs; t.comissao+=p.comissao;
    t.receita+=receita(p); t.margem+=margem(p);
  });
  t.ads     = ads.reduce((s,a)=>s+a.gasto,0);
  t.cliques = ads.reduce((s,a)=>s+a.cliques,0);
  t.caixa   = t.prod + t.freteCob;
  t.lucro   = t.margem - t.ads;
  t.mg      = t.receita ? t.lucro/t.receita*100 : 0;
  t.ticket  = t.n ? t.caixa/t.n : 0;
  t.roas    = t.ads ? t.caixa/t.ads : 0;
  return t;
}
function fixoNoPeriodo(f){
  /* em "Tudo" a faixa comeca em 2000 — usa a data do 1o pedido, senao o rateio explode */
  const primeiro = D.pedidos.length ? D.pedidos.reduce((a,p)=>p.data<a?p.data:a, D.pedidos[0].data) : f[0];
  const ini = f[0] > primeiro ? f[0] : primeiro;
  const dias = Math.max(1, Math.round((new Date(f[1]+"T12:00:00")-new Date(ini+"T12:00:00"))/864e5)+1);
  const mensal = D.fixos.filter(x=>x.ativo!==false).reduce((s,x)=>s+(+x.valor_mensal||0),0);
  return mensal/30*dias;
}

/* ==================================================== agrupamento ======= */
const chaveGran = d => S.gran==="dia" ? d : S.gran==="semana" ? segunda(d) : d.slice(0,7);
function serie(f){
  const out = {};
  pedidosDe(f).forEach(p=>{
    const k = chaveGran(p.data);
    (out[k] ||= {k,receita:0,margem:0,n:0,ads:0});
    out[k].receita+=receita(p); out[k].margem+=margem(p); out[k].n++;
  });
  adsDe(f).forEach(a=>{
    const k = chaveGran(a.data);
    (out[k] ||= {k,receita:0,margem:0,n:0,ads:0}); out[k].ads+=a.gasto;
  });
  const arr = Object.values(out).sort((x,y)=>x.k<y.k?-1:1);
  arr.forEach(x=>x.lucro=x.margem-x.ads);
  return arr;
}
function rotulo(k){
  if(S.gran==="mes") return MES[+k.slice(5,7)-1]+"/"+k.slice(2,4);
  return k.slice(8,10)+"/"+k.slice(5,7);
}

/* ==================================================== componentes ======= */
function chart(dados, campo, onTap){
  const box = el("div","card");
  if(!dados.length){ box.append(el("div","empty","Sem movimento nesse período.")); return box; }
  const c = el("div","chart");
  const max = Math.max(...dados.map(d=>Math.abs(d[campo])),1);
  const bars = el("div","bars"), xax = el("div","xax");
  const passo = Math.max(1,Math.ceil(dados.length/7));
  dados.forEach((d,i)=>{
    const b = el("button","bar"+(S.sel===d.k?" sel":""));
    const neg = d[campo]<0;
    b.innerHTML = `<span class="tip">${rotulo(d.k)} · ${brl(d[campo])}</span>
      <span class="fill ${campo==="receita"?"":(neg?"perda":"lucro")}"
        style="height:${Math.abs(d[campo])/max*100}%"></span>`;
    b.onclick = ()=>{ S.sel = S.sel===d.k?null:d.k; render(); if(onTap&&S.sel) onTap(d); };
    bars.append(b);
    xax.append(el("span",null, (i%passo===0||i===dados.length-1) ? rotulo(d.k) : ""));
  });
  c.append(bars,xax); box.append(c); return box;
}
function linha({ic,t,s,a,b,cls,onclick}){
  const r = el("button","row");
  r.innerHTML = `${ic?`<span class="ic">${ic}</span>`:""}
    <span class="mid"><span class="t">${esc(t)}</span>${s?`<span class="s">${esc(s)}</span>`:""}</span>
    <span class="rt">${a!=null?`<span class="a">${a}</span>`:""}${b?`<span class="b ${cls||""}">${b}</span>`:""}</span>`;
  if(onclick) r.onclick = onclick; else r.style.cursor="default";
  return r;
}
function kpi(k,v,d,onclick){
  const b = el("button","kpi");
  b.innerHTML = `<span class="k">${k}</span><span class="v">${v}</span>${d?`<span class="d">${esc(d)}</span>`:""}`;
  if(onclick) b.onclick=onclick; else b.style.cursor="default";
  return b;
}
function grupoChips(itens, atual, cb, alt){

    const c = el("button","chip"+(alt?" alt":"")+(v===atual?" on":""),l);

}

function detFixos(f,t,fx){
  const ativos = D.fixos.filter(x=>x.ativo!==false);
  const mensal = ativos.reduce((s,x)=>s+(+x.valor_mensal||0),0);
  const prop = mensal ? fx/mensal : 0;
  const c=el("div"), box=el("div","card");
  ativos.sort((a,b)=>(+b.valor_mensal||0)-(+a.valor_mensal||0)).forEach(x=>
    box.append(linha({t:x.item,s:`${brl2(+x.valor_mensal||0)}/mês · ${x.categoria||""}`,
      a:brl2((+x.valor_mensal||0)*prop)})));
  c.append(box);
  c.append(dl([
    ["Lucro operacional", brl2(t.lucro)],
    ["Custos fixos no período","−"+brl2(fx),"neg"],
    ["<b>Sobra de verdade</b>",`<b class="${t.lucro-fx<0?"neg":"pos"}">${brl2(t.lucro-fx)}</b>`],
  ]));
  c.append(el("div","note","A ajudante entra <b>aqui</b>, não no custo por peça — ela é paga por mês, venda muito ou pouco. Por isso a margem de cada pedido é <b>margem de contribuição</b>: o que sobra antes dos fixos. Edite os valores em <b>Custos</b>."));
  abrir("Custos fixos", c);
}

  const lista=el("div","card"); lista.style.marginTop="14px";

function detReceita(f){
  const t=totais(f);
  abrir("Receita do período", dl([
    ["Produtos", brl2(t.prod+t.desconto)],
    t.desconto?["Descontos e cupons","−"+brl2(t.desconto),"neg"]:null,
    ["Frete cobrado do cliente", brl2(t.freteCob)],
    ["<b>Entrou no caixa</b>", "<b>"+brl2(t.caixa)+"</b>"],
    ["Frete que eu paguei", "−"+brl2(t.fretePago), "neg"],
    ["<b>Receita líquida de frete</b>", "<b>"+brl2(t.caixa-t.fretePago)+"</b>"],
  ]));
}
function detFrete(f){
  const ps = pedidosDe(f).filter(p=>p.frete_pago||p.frete_cobrado);
  const cob = ps.reduce((s,p)=>s+p.frete_cobrado,0);
  const pag = ps.reduce((s,p)=>s+p.frete_pago,0);
  const gratis = ps.filter(p=>p.frete_cobrado===0 && p.frete_pago>0);
  const gp = gratis.reduce((s,p)=>s+p.frete_pago,0);
  const c = el("div");
  c.append(dl([
    ["Frete cobrado dos clientes", brl2(cob)],
    ["Frete pago às transportadoras", "−"+brl2(pag), "neg"],
    ["<b>Resultado do frete</b>", `<b class="${cob-pag<0?"neg":"pos"}">${brl2(cob-pag)}</b>`],
    ["Pedidos com frete grátis", num(gratis.length)+" de "+num(ps.length)],
    ["Quanto o frete grátis custou", "−"+brl2(gp), "neg"],
  ]));
  const tr={};
  ps.forEach(p=>{
    const m=(p.obs||"").match(/#\d+\s+(.*)/);
    const k=(m&&m[1])||"sem transportadora";
    (tr[k] ||= {n:0,c:0,p:0}); tr[k].n++; tr[k].c+=p.frete_cobrado; tr[k].p+=p.frete_pago;
  });
  const box=el("div","card"); box.style.marginTop="14px";
  Object.entries(tr).sort((a,b)=>(b[1].p-b[1].c)-(a[1].p-a[1].c)).slice(0,12).forEach(([k,v])=>
    box.append(linha({t:k,s:`${v.n} envios · cobrei ${brl(v.c)}`,a:brl2(v.p),
      b:brl2(v.c-v.p),cls:v.c-v.p<0?"neg":"pos"})));
  c.append(box);
  c.append(el("div","note","À direita: quanto <b>você pagou</b> à transportadora e, abaixo, o resultado (cobrado − pago). Vermelho = você bancou a diferença."));
  abrir("Frete", c);
}
function detTaxas(f){
  const porC={};
  pedidosDe(f).forEach(p=>{ (porC[p.canal] ||= {t:0,b:0,n:0});
    porC[p.canal].t+=p.taxa; porC[p.canal].b+=p.bruto+p.frete_cobrado; porC[p.canal].n++; });
  const c=el("div"), box=el("div","card");

  c.append(el("div","note","As taxas do <b>Mercado Pago</b> vêm reais da API, pagamento a pagamento. As do <b>site</b> (Nuvem Pago) são calculadas por percentual — confira no extrato e ajuste em <b>Mais › Parâmetros</b>."));

function detProdutos(f){
  const ids = new Set(pedidosDe(f).map(p=>p.id));
  const agg={};
  D.itens.forEach(i=>{ if(!ids.has(i.pedido_id)) return;
    const k=i.produto||"—"; (agg[k] ||= {q:0,r:0,c:0});
    agg[k].q+=i.qtd; agg[k].r+=i.qtd*i.preco_un; agg[k].c+=i.qtd*i.custo_un; });
  const box=el("div","card");
  const lista=Object.entries(agg).sort((a,b)=>b[1].r-a[1].r);
  if(!lista.length) box.append(el("div","empty","Só os pedidos do site registram item a item."));
  lista.slice(0,50).forEach(([k,v])=>box.append(linha({t:k,
    s:`${num(v.q)} un · custo ${brl2(v.c)}`,a:brl2(v.r),
    b:"margem "+pct(v.r?(v.r-v.c)/v.r*100:0),cls:"pos"})));
  const c=el("div"); c.append(box);
  c.append(el("div","note","Item a item existe só nos pedidos do <b>site</b>. Nas vendas de rua o Mercado Pago não informa qual produto foi vendido — lá o custo entra por percentual."));
  abrir("Produtos vendidos", c);

                      .sort((a,b)=>b.bruto-a.bruto);

function formVenda(){

  [["data","Data","date",hojeISO()],["bruto","Valor total (R$)","number",""],
   ["evento","Evento ou lugar","text",""],["vendedor","Vendedor","text",""],

  b.onclick=async()=>{
    const bruto=+ins.bruto.value||0;

    const {error}=await sb.from("fin_pedidos").insert({
      origem:"manual", origem_id:"m-"+Date.now(), data:ins.data.value, canal:"dinheiro",

  c.append(el("div","note","Estes valores valem para os próximos cálculos do <b>sync</b>. Os pedidos já gravados mantêm o valor antigo até o próximo sync."));

function exportar(){
  const cab=["data","canal","evento","vendedor","cliente","uf","bruto","desconto",
             "frete_cobrado","frete_pago","taxa","cogs","comissao","margem"];
  const linhas=[cab.join(";")];
  D.pedidos.forEach(p=>linhas.push(cab.map(k=>{
    const v = k==="margem" ? margem(p) : p[k];
    return typeof v==="number" ? String(v).replace(".",",") : (v??"");
  }).join(";")));
  const blob=new Blob(["﻿"+linhas.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="brochevique-pedidos.csv"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("CSV baixado");
}

/* ==================================================== boot ============== */
async function boot(){
  $("#login").classList.add("hide"); $("#app").classList.remove("hide");
  try { await carregar(); render(); }
  catch(e){ $("#view").innerHTML=`<div class="empty">Erro ao carregar: ${esc(e.message||e)}</div>`; }
}
$("#ovl").onclick = fechar;
$("#shX").onclick = fechar;
$("#entrar").onclick = async ()=>{
  const b=$("#entrar"); b.textContent="Entrando…"; b.disabled=true;
  const {error} = await sb.auth.signInWithPassword({
    email:$("#em").value.trim(), password:$("#pw").value});
  b.textContent="Entrar"; b.disabled=false;
  if(error){ $("#erro").textContent="E-mail ou senha inválidos."; return; }
  boot();
};
$("#pw").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#entrar").click(); });
$("#btSync").onclick = async ()=>{ toast("Atualizando…"); await carregar(); render(); toast("Atualizado"); };
sb.auth.getSession().then(({data})=>{ if(data.session) boot(); });
</script>
</body>
</html>
